[project]
name = "okaeri"
version = "0.1.0"
description = "A calm localhost homepage for the latest papers, blogs and forums."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "huggingface-hub>=0.30",
    "jinja2>=3.1",
    "numpy>=2",
    "onnxruntime>=1.20",
    "python-multipart>=0.0.9",
    "tokenizers>=0.20",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
