[project]
name = "okaeri"
version = "0.1.0"
description = "A calm localhost homepage for the latest papers, blogs and forums."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
okaeri = "okaeri.server:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
