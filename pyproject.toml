[project]
name = "okaeri"
version = "0.1.0"
description = "A calm localhost homepage for the latest papers, blogs and forums."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "huggingface-hub>=0.30",
    "jinja2>=3.1",
    "numpy>=2",
    "onnxruntime>=1.20",
    "python-multipart>=0.0.9",
    "tokenizers>=0.20",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long strings and comments the formatter can't wrap. B905: zip(strict=) everywhere is noise here.
ignore = ["E501", "B905"]
